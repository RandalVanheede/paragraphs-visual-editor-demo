<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paragraphs Visual Editor demo</title>
<style>
:root {
  --accent: #0b3fd1;
  --ink: #1b1b1f;
  --muted: #6b6b76;
  --line: #d6d8e0;
  --bg: #eef0f5;
  --panel: #fff;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); height: 100vh; overflow: hidden; }
button { font: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }

/* ---- Sidebar ---- */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side h1 { font-size: 1rem; margin: 0; padding: 14px 16px 8px; }
.banner { margin: 0 12px 8px; padding: 10px; border-radius: 8px; background: #e3e9ff; border: 1px solid #b9c6f5; }
.banner[hidden] { display: none; }
.banner p { margin: 0 0 8px; font-weight: 600; }
.btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.list { overflow: auto; padding: 4px 12px 12px; flex: 1; }
.list ul { list-style: none; margin: 0; padding: 0; }
.row { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; padding: 8px 10px; background: #fff; }
.row.sel { background: #e3e9ff; border-color: var(--accent); }
.row .head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.num { background: var(--accent); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.type { color: var(--muted); font-size: 12px; }
.count { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12px; background: #fff; }
.tools { display: flex; gap: 4px; margin-top: 8px; }
.tools button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.tools .go { background: var(--accent); color: #fff; border-color: var(--accent); }
.nested { margin: 6px 0 0 8px; padding-left: 8px; border-left: 2px solid var(--line); }
.add { margin-top: 6px; padding: 4px 10px; border: 1px dashed var(--accent); border-radius: 6px; background: none; color: var(--accent); }
.addtop { margin: 0 12px 12px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; }

/* ---- Preview ---- */
.stage { overflow: auto; padding: 28px 40px 80px; }
.page { max-width: 880px; margin: 0 auto; background: #fff; box-shadow: 0 2px 16px #0002; padding: 28px; font-family: Georgia, serif; }
.pv-p { position: relative; margin: 22px 0; outline: 1px dashed transparent; outline-offset: 4px; border-radius: 4px; transition: outline-color .15s; }
.pv-p.active, .pv-p.sel { outline: 2px dashed var(--accent); }
.pv-p.sel { outline-style: solid; }
.pv-p > .tag { display: none; position: absolute; top: -26px; left: -4px; background: var(--accent); color: #fff; font: 12px/20px system-ui; padding: 0 8px; border-radius: 3px; z-index: 3; }
.pv-p.active > .tag, .pv-p.sel > .tag { display: block; }
.pv-p > .bar { display: none; position: absolute; top: -34px; right: -4px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; z-index: 4; box-shadow: 0 2px 8px #0003; }
.pv-p.active > .bar, .pv-p.sel > .bar { display: flex; }
.bar button { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 13px; }
.ins { display: none; position: absolute; z-index: 4; width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; font: 700 18px/26px system-ui; padding: 0; }
.pv-p.active > .ins, .pv-p.sel > .ins { display: block; }
.dir-v > .ins[data-where=before] { top: -13px; left: 50%; transform: translateX(-50%); }
.dir-v > .ins[data-where=after] { bottom: -13px; left: 50%; transform: translateX(-50%); }
.dir-h > .ins { top: 50%; transform: translateY(-50%); }
.dir-h > .ins[data-where=before] { left: -13px; }
.dir-h > .ins[data-where=after] { right: -13px; }
.hero { background: linear-gradient(120deg, #1d2b64, #8e2de2); color: #fff; padding: 44px 32px; border-radius: 6px; }
.hero h2 { margin: 0 0 6px; font: 800 2.2rem/1.1 system-ui; }
.pv-p .hero p { margin: 0; color: #fff; opacity: .9; }
.pv-p h3 { font: 700 1.4rem system-ui; margin: 0 0 12px; }
.cards { display: flex; gap: 20px; }
.card { flex: 1; margin: 0 !important; border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: #fafbff; }
.card h4 { margin: 0 0 6px; font: 700 1.1rem system-ui; }
.card p, .item p, .txt p { margin: 0; color: #444; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0 !important; }
.item h4 { margin: 0 0 4px; font: 700 1rem system-ui; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 8px; padding: 16px; text-align: center; font-family: system-ui; border: 1px dashed color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 3%, #fff); color: #6b6b76; }
.empty small { font-size: 13px; color: #7c7c87; }
.empty button { margin-top: 8px; padding: 6px 14px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, #fff); color: var(--accent); font-weight: 600; }

/* ---- Edit panel ---- */
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -6px 0 24px #0003; padding: 18px; overflow: auto; z-index: 20; transform: translateX(105%); transition: transform .2s; }
.panel.open { transform: none; }
.panel h2 { margin: 0 0 12px; font-size: 1.05rem; }
.panel label { display: block; font-weight: 600; margin: 12px 0 4px; }
.panel input, .panel textarea { width: 100%; padding: 8px; border: 1px solid #9aa0b0; border-radius: 6px; font: inherit; }
.panel .live { color: var(--muted); font-size: 12px; margin-top: 4px; }
.panel .actions { display: flex; gap: 8px; margin-top: 18px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.tile b { display: block; } .tile span { color: var(--muted); font-size: 12px; }

/* ---- Tour ---- */
.tour { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); background: #14161f; color: #fff; border-radius: 12px; padding: 16px 18px; z-index: 50; box-shadow: 0 8px 32px #0007; }
.tour h3 { margin: 0 0 4px; font-size: 1rem; }
.tour p { margin: 0 0 12px; color: #d8dbe8; }
.tour .nav { display: flex; gap: 8px; align-items: center; }
.tour .nav .grow { flex: 1; color: #9aa0b8; font-size: 12px; }
.tour .btn { background: #262a3a; border-color: #3a3f55; color: #fff; }
.tour .btn.primary { background: #5b82ff; border-color: #5b82ff; }
.tour-hl { box-shadow: 0 0 0 4px #ffb800, 0 0 0 9px #ffb80055 !important; border-radius: 8px; }
.toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #14161f; color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } .side { max-height: 40vh; } .panel { width: 100%; } .cards { flex-direction: column; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Structure">
    <h1>Editing: Blocks <span class="type">(demo, nothing is saved)</span></h1>
    <div class="banner" id="banner" hidden>
      <p id="bannerText"></p>
      <button class="btn primary" id="save">Save</button>
      <button class="btn" id="discard">Discard</button>
      <button class="btn" id="undo" title="Undo">↶ Undo</button>
    </div>
    <div class="list" id="list"></div>
    <button class="addtop" id="addTop">Add paragraph</button>
  </aside>
  <main class="stage"><div class="page" id="page"></div></main>
</div>
<aside class="panel" id="panel" aria-live="polite"></aside>
<div class="tour" id="tour" role="dialog" aria-label="Tour"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  let seq = 0;
  const uid = () => `p${++seq}`;

  // What each paragraph type has, and what a container may hold.
  const TYPES = {
    hero: { label: 'Hero', fields: { title: 'Title', sub: 'Subtitle' }, desc: 'Big banner with a title' },
    text: { label: 'Text', fields: { body: 'Body' }, desc: 'A block of text' },
    cards: { label: 'Cards (nested)', fields: { title: 'Title' }, child: 'card', dir: 'h', desc: 'Cards side by side' },
    accordion: { label: 'Accordion (nested)', fields: { title: 'Title' }, child: 'item', dir: 'v', desc: 'Questions and answers' },
    card: { label: 'Card', fields: { title: 'Title', body: 'Body' } },
    item: { label: 'Accordion item', fields: { title: 'Question', body: 'Answer' } },
  };
  const TOP = ['hero', 'text', 'cards', 'accordion'];
  const make = (type, props = {}) => ({ id: uid(), type, props: { ...props }, kids: TYPES[type].child ? [] : null });

  let blocks = [
    make('hero', { title: 'Visual editing for Paragraphs', sub: 'Edit in the real theme' }),
    make('text', { body: 'Hover a paragraph to see its tools. Everything you change shows up at once.' }),
    make('cards', { title: 'Three cards' }),
    make('accordion', { title: 'Frequently asked' }),
  ];
  const cards = blocks[2];
  ['One', 'Two', 'Three'].forEach((n) => cards.kids.push(make('card', { title: `Card ${n}`, body: `Body text of card ${n.toLowerCase()}.` })));

  let saved = JSON.stringify(blocks);
  let history = [];
  let changes = 0;
  let selected = null;
  let active = null;
  let editing = null; // { block, orig, temp, list, index }
  let openGroups = new Set();

  const clone = (x) => JSON.parse(JSON.stringify(x));
  const find = (id, list = blocks, parent = null) => {
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === id) return { block: list[i], list, index: i, parent };
      if (list[i].kids) {
        const hit = find(id, list[i].kids, list[i]);
        if (hit) return hit;
      }
    }
    return null;
  };
  const toast = (text) => {
    const t = $('#toast'); t.textContent = text; t.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800);
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const titleOf = (b) => b.props.title || b.props.body || TYPES[b.type].label;

  // Every change goes through here: undo history plus the draft counter.
  const commit = (fn, label) => {
    history.push({ blocks: clone(blocks), changes });
    fn(); changes++; render();
    if (label) toast(label);
  };

  // ---- Sidebar ----
  const rowFor = (b, n, parentField) => {
    const li = el('li');
    const row = el('div', `row${selected === b.id ? ' sel' : ''}`);
    row.dataset.row = b.id;
    const head = el('div', 'head');
    if (n) head.append(el('span', 'num', n));
    const name = el('span', 'name', titleOf(b));
    head.append(name);
    if (b.kids) {
      const tw = el('button', 'count', `${openGroups.has(b.id) ? '▾' : '▸'} ${b.kids.length}`);
      tw.title = 'Show or hide the nested paragraphs';
      tw.addEventListener('click', (e) => { e.stopPropagation(); openGroups.has(b.id) ? openGroups.delete(b.id) : openGroups.add(b.id); render(); });
      head.prepend(tw);
    }
    row.append(head, el('div', 'type', TYPES[b.type].label));
    head.addEventListener('click', () => select(b.id));
    if (selected === b.id) {
      const tools = el('div', 'tools');
      [['✎', 'Edit', 'go', () => edit(b.id)], ['↑', 'Move up', '', () => move(b.id, -1)], ['↓', 'Move down', '', () => move(b.id, 1)], ['✕', 'Remove', '', () => remove(b.id)]]
        .forEach(([t, title, cls, fn]) => { const x = el('button', cls, t); x.title = title; x.setAttribute('aria-label', title); x.addEventListener('click', fn); tools.append(x); });
      row.append(tools);
    }
    if (b.kids && openGroups.has(b.id)) {
      const ul = el('ul', 'nested');
      b.kids.forEach((k, i) => ul.append(rowFor(k, 0)));
      const add = el('button', 'add', `+ Add ${TYPES[TYPES[b.type].child].label.toLowerCase()}s`);
      add.addEventListener('click', () => addTo(b.id, b.kids.length));
      ul.append(add);
      row.append(ul);
    }
    li.append(row);
    return li;
  };

  // ---- Preview ----
  const preview = (b, dir) => {
    const p = el('div', `pv-p dir-${dir} ${b.type}${selected === b.id ? ' sel' : ''}${active === b.id ? ' active' : ''}`);
    p.dataset.id = b.id;
    p.append(el('span', 'tag', TYPES[b.type].label));
    const bar = el('div', 'bar');
    [['✎', 'Edit', () => edit(b.id)], ['↑', 'Move up', () => move(b.id, -1)], ['↓', 'Move down', () => move(b.id, 1)], ['✕', 'Remove', () => remove(b.id)]]
      .forEach(([t, title, fn]) => { const x = el('button', '', t); x.title = title; x.addEventListener('click', (e) => { e.stopPropagation(); fn(); }); bar.append(x); });
    p.append(bar);
    ['before', 'after'].forEach((where) => {
      const x = el('button', 'ins', '+'); x.dataset.where = where; x.title = 'Add paragraph here';
      x.addEventListener('click', (e) => {
        e.stopPropagation();
        const at = find(b.id);
        addTo(at.parent ? at.parent.id : null, at.index + (where === 'after' ? 1 : 0));
      });
      p.append(x);
    });
    const body = el('div', 'txt');
    const { props } = b;
    if (b.type === 'hero') { const h = el('div', 'hero'); h.append(el('h2', '', props.title || ''), el('p', '', props.sub || '')); body.append(h); }
    else if (b.type === 'text') body.append(el('p', '', props.body || ''));
    else if (b.type === 'card' || b.type === 'item') { body.append(el('h4', '', props.title || ''), el('p', '', props.body || '')); }
    else {
      body.append(el('h3', '', props.title || ''));
      const wrap = el('div', b.type === 'cards' ? 'cards' : 'items');
      b.kids.forEach((k) => wrap.append(preview(k, TYPES[b.type].dir)));
      if (!b.kids.length) {
        const e = el('div', 'empty');
        e.append(el('strong', '', `No ${TYPES[TYPES[b.type].child].label.toLowerCase()}s yet`),
          el('small', '', 'A placeholder for the editor: it is not shown on the published page.'));
        const add = el('button', '', `+ Add ${TYPES[TYPES[b.type].child].label.toLowerCase()}s`);
        add.addEventListener('click', (e2) => { e2.stopPropagation(); addTo(b.id, 0); });
        e.append(add); wrap.append(e);
      }
      body.append(wrap);
    }
    p.append(body);
    return p;
  };

  const render = () => {
    const list = $('#list'); const ul = el('ul');
    blocks.forEach((b, i) => ul.append(rowFor(b, i + 1)));
    list.replaceChildren(ul);
    const page = $('#page');
    const keep = page.parentElement.scrollTop;
    page.replaceChildren(...blocks.map((b) => preview(b, 'v')));
    page.parentElement.scrollTop = keep;
    $('#banner').hidden = !changes;
    $('#bannerText').textContent = `Draft: ${changes} unsaved change${changes === 1 ? '' : 's'}.`;
    $('#undo').disabled = !history.length;
  };

  // Hover in the preview activates the innermost paragraph.
  $('#page').addEventListener('mouseover', (e) => {
    const p = e.target.closest('.pv-p');
    const id = p ? p.dataset.id : null;
    if (id !== active) { setActive(id); }
  });
  $('#page').addEventListener('mouseleave', () => setActive(null));
  $('#page').addEventListener('click', (e) => { const p = e.target.closest('.pv-p'); if (p) select(p.dataset.id); });
  const setActive = (id) => {
    active = id;
    document.querySelectorAll('.pv-p').forEach((n) => n.classList.toggle('active', n.dataset.id === id));
  };
  const select = (id) => {
    if (editing && editing.block.id !== id && !leave()) return;
    selected = id; render();
    const n = $(`.pv-p[data-id="${id}"]`); if (n) n.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };

  // ---- Actions ----
  const move = (id, d) => commit(() => {
    const at = find(id); const j = at.index + d;
    if (j < 0 || j >= at.list.length) return;
    [at.list[at.index], at.list[j]] = [at.list[j], at.list[at.index]];
  }, 'Moved');
  const remove = (id) => commit(() => { const at = find(id); at.list.splice(at.index, 1); if (selected === id) selected = null; }, 'Removed');

  // Add: a container with one allowed type skips the chooser.
  const addTo = (parentId, index) => {
    if (editing && !leave()) return;
    const parent = parentId ? find(parentId).block : null;
    const allowed = parent ? [TYPES[parent.type].child] : TOP;
    if (parent) openGroups.add(parent.id);
    const go = (type) => {
      const b = make(type, Object.fromEntries(Object.keys(TYPES[type].fields).map((k) => [k, ''])));
      const list = parent ? parent.kids : blocks;
      history.push({ blocks: clone(blocks), changes });
      list.splice(index, 0, b);
      selected = b.id;
      edit(b.id, true);
    };
    if (allowed.length === 1) return go(allowed[0]);
    const panel = $('#panel'); panel.replaceChildren(el('h2', '', 'Add paragraph'));
    const grid = el('div', 'tiles');
    allowed.forEach((t) => {
      const b = el('button', 'tile'); b.append(el('b', '', TYPES[t].label), el('span', '', TYPES[t].desc));
      b.addEventListener('click', () => go(t)); grid.append(b);
    });
    const cancel = el('button', 'btn', 'Cancel'); cancel.addEventListener('click', closePanel);
    panel.append(grid, el('div', 'actions')); panel.lastChild.append(cancel);
    panel.classList.add('open');
  };

  // ---- Edit panel with live preview ----
  let timer = 0;
  const edit = (id, temp = false) => {
    if (editing && editing.block.id !== id && !leave()) return;
    const at = find(id); const b = at.block;
    editing = { block: b, orig: clone(b.props), temp, dirty: temp };
    selected = id; render();
    const panel = $('#panel');
    panel.replaceChildren(el('h2', '', `${temp ? 'Add' : 'Edit'} ${TYPES[b.type].label}`));
    Object.entries(TYPES[b.type].fields).forEach(([k, label]) => {
      const lab = el('label', '', label); const input = el(k === 'body' ? 'textarea' : 'input'); input.value = b.props[k] || '';
      if (k === 'body') input.rows = 4;
      input.addEventListener('input', () => {
        b.props[k] = input.value; editing.dirty = true;
        clearTimeout(timer); timer = setTimeout(render, 400); // debounce, as the module does
      });
      panel.append(lab, input);
    });
    panel.append(el('div', 'live', 'The preview follows what you type (400 ms debounce). Nothing is saved yet.'));
    const actions = el('div', 'actions');
    const save = el('button', 'btn primary', 'Save'); save.dataset.save = '';
    save.addEventListener('click', () => {
      const wasTemp = editing.temp; const dirty = editing.dirty;
      if (!wasTemp && dirty) {
        // The undo step brings back the text from before this edit.
        const prev = clone(blocks); find(editing.block.id, prev).block.props = editing.orig;
        history.push({ blocks: prev, changes });
      }
      editing = null; panel.classList.remove('open');
      if (wasTemp || dirty) { changes++; }
      render(); toast('Saved to the draft');
    });
    const cancel = el('button', 'btn', 'Cancel'); cancel.dataset.cancel = '';
    cancel.addEventListener('click', () => cancelEdit());
    actions.append(save, cancel); panel.append(actions);
    panel.classList.add('open');
    const first = panel.querySelector('input, textarea'); if (first) first.focus();
  };
  const cancelEdit = () => {
    if (!editing) return closePanel();
    clearTimeout(timer);
    if (editing.temp) { const at = find(editing.block.id); at.list.splice(at.index, 1); history.pop(); selected = null; }
    else editing.block.props = editing.orig;
    editing = null; $('#panel').classList.remove('open'); render();
  };
  const closePanel = () => { $('#panel').classList.remove('open'); };
  // Leaving an unsaved form: the browser's own "unsaved changes" question.
  const leave = () => {
    if (editing && editing.dirty && !confirm('You have unsaved changes in this paragraph. Leave anyway?')) return false;
    cancelEdit(); return true;
  };
  window.addEventListener('beforeunload', (e) => { if (editing && editing.dirty) { e.preventDefault(); } });

  $('#addTop').addEventListener('click', () => addTo(null, blocks.length));
  $('#undo').addEventListener('click', () => { if (editing) cancelEdit(); const h = history.pop(); if (h) { blocks = h.blocks; changes = h.changes; selected = null; render(); toast('Undone'); } });
  $('#discard').addEventListener('click', () => { if (editing) cancelEdit(); blocks = JSON.parse(saved); history = []; changes = 0; selected = null; render(); toast('Draft discarded'); });
  $('#save').addEventListener('click', () => { if (editing && !leave()) return; saved = JSON.stringify(blocks); history = []; changes = 0; render(); toast('Published (demo)'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && editing) cancelEdit(); });

  // ---- Tour ----
  const typeInto = async (input, text) => {
    for (const ch of text) { input.value += ch; input.dispatchEvent(new Event('input')); await new Promise((r) => setTimeout(r, 70)); }
  };
  const cardsEl = () => $(`.pv-p[data-id="${cards.id}"]`);
  const accId = () => blocks[3].id;
  const STEPS = [
    { title: 'Welcome', text: 'A Gutenberg-like visual editor for Paragraphs. This page is a static mock of it; click along or press Next.', run() { reset(); } },
    { title: 'Structure and preview', text: 'The sidebar shows the paragraph tree. The page on the right is the real theme. Click a paragraph on either side to select it.', target: '.side', run() { select(blocks[1].id); } },
    { title: 'Tools and + buttons', text: 'Hover a paragraph: tools appear above it, and a + on each side to add a paragraph there. The Cards use left/right +, stacked paragraphs use top/bottom.', target: () => $(`.pv-p[data-id="${blocks[1].id}"]`), run() { setActive(blocks[1].id); } },
    { title: 'Instant preview', text: 'Editing opens a panel. As you type, the preview follows after a 400 ms pause. Watch the hero title.', target: '#panel', async run() { edit(blocks[0].id); await new Promise((r) => setTimeout(r, 500)); await typeInto($('#panel input'), ' - live!'); } },
    { title: 'Leave without saving', text: 'Cancel, or open another paragraph, and the preview goes back to the saved version. The browser asks first when there are unsaved changes.', target: '.page', run() { cancelEdit(); } },
    { title: 'Empty container', text: 'A container with no items shows a soft placeholder, only in the editor. It is never rendered on the published page.', target: () => $(`.pv-p[data-id="${accId()}"] .empty`), run() { selected = null; setActive(null); render(); $(`.pv-p[data-id="${accId()}"]`).scrollIntoView({ block: 'center' }); } },
    { title: 'Add the first item', text: 'Only one type is allowed in an accordion, so the type chooser is skipped and the form opens straight away.', target: '#panel', async run() { addTo(accId(), 0); await new Promise((r) => setTimeout(r, 400)); await typeInto($('#panel input'), 'What is this?'); } },
    { title: 'Side by side', text: 'Cards sit next to each other, so + goes left and right. It is detected from the layout; a theme can force it with data-pve-direction.', target: () => cardsEl(), run() { cancelEdit(); const k = cards.kids[0]; cardsEl().scrollIntoView({ block: 'center' }); setActive(k.id); } },
    { title: 'Draft, undo, save', text: 'Changes are kept in a draft. Undo steps back, Discard drops the draft, Save publishes. Try the + buttons yourself.', target: '#banner', run() { setActive(null); if (!changes) commit(() => { blocks[1].props.body += ' (edited)'; }); } },
  ];
  let step = 0;
  const reset = () => { if (editing) cancelEdit(); blocks = JSON.parse(saved); history = []; changes = 0; selected = null; active = null; render(); };
  const showStep = async (n) => {
    step = Math.max(0, Math.min(STEPS.length - 1, n));
    document.querySelectorAll('.tour-hl').forEach((x) => x.classList.remove('tour-hl'));
    if (editing) cancelEdit();
    const s = STEPS[step];
    drawTour(s);
    if (s.run) await s.run();
    const t = typeof s.target === 'function' ? s.target() : s.target && $(s.target);
    if (t) t.classList.add('tour-hl');
  };
  const drawTour = (s) => {
    const t = $('#tour');
    const nav = el('div', 'nav');
    const back = el('button', 'btn', 'Back'); back.disabled = step === 0; back.addEventListener('click', () => showStep(step - 1));
    const next = el('button', 'btn primary', step === STEPS.length - 1 ? 'Finish' : 'Next');
    next.addEventListener('click', () => (step === STEPS.length - 1 ? endTour() : showStep(step + 1)));
    const skip = el('button', 'btn', 'Skip'); skip.addEventListener('click', endTour);
    nav.append(back, next, el('span', 'grow', `${step + 1} / ${STEPS.length}`), skip);
    t.replaceChildren(el('h3', '', s.title), el('p', '', s.text), nav);
  };
  const endTour = () => { document.querySelectorAll('.tour-hl').forEach((x) => x.classList.remove('tour-hl')); $('#tour').hidden = true; };

  render();
  showStep(0);
})();
</script>
</body>
</html>
